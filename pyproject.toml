[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "layer-decomposition"
version = "0.1.0"
description = "Agentic pipeline that decomposes illustrations into background + element layers."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "accelerate",
    "diffusers==0.36.0",
    "einops",
    "loguru",
    "numpy",
    "packaging",
    "pillow",
    "qwen-vl-utils",
    "rembg",
    "safetensors",
    "sentencepiece",
    "torch==2.8.0",
    "torchvision",
    "transformers>=4.57.0,<4.58.0",
]

[project.optional-dependencies]
# Prompt rewriting (requires the openai client).
rewrite = ["openai"]

[project.scripts]
decompose = "main:main"

# This repo uses a flat, top-level-module layout (no package directory), so
# the modules are listed explicitly. The `joyai-image-release` package is a
# prerequisite and is NOT a dependency here because it is not on PyPI; install
# it first (see README) or point JOYAI_SRC_DIR at a clone.
[tool.setuptools]
py-modules = [
    "call_JoyAI",
    "call_Qwen3VL",
    "cleaner",
    "collage_svg",
    "config",
    "gather_reconstruction",
    "logger",
    "main",
    "pipeline",
    "pipeline_tools",
    "prompts",
    "scene_graph",
]
