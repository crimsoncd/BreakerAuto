[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "layer-decomposition"
version = "0.1.0"
description = "Agentic pipeline that decomposes illustrations into background + element layers."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "torch>=2.8.0",
    "torchvision",
    "diffusers>=0.41.0",
    "transformers>=4.57.0",
    "accelerate",
    "einops",
    "loguru",
    "numpy",
    "packaging",
    "pillow",
    "rembg",
    "safetensors",
    "sentencepiece",
]

[project.optional-dependencies]
# Prompt rewriting (requires the openai client).
rewrite = ["openai"]

[project.scripts]
decompose = "main:main"

# This repo uses a flat, top-level-module layout (no package directory), so
# the modules are listed explicitly. The Qwen-Image-2.1 edit model loads via
# diffusers (QwenImage21Pipeline from config.QWEN_EDIT_CKPT_ROOT) — no
# separate source repo is needed.
[tool.setuptools]
py-modules = [
    "call_bailian_vlm",
    "call_qwen_edit",
    "cleaner",
    "collage_svg",
    "config",
    "gather_reconstruction",
    "logger",
    "main",
    "pipeline",
    "pipeline_tools",
    "prompts",
    "scene_graph",
]
